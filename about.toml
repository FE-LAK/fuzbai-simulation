accepted = [
    # Very common
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",

    # Other
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "Zlib",
    "OFL-1.1",
    "Ubuntu-font-1.0"
]

targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

# Skip crates not present in final binaries.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Fixes for failed automatic detection
[zstd-sys.clarify]
license = "(MIT OR Apache-2.0) AND BSD-3-Clause"

[[zstd-sys.clarify.files]]
path = "LICENSE.Mit"
